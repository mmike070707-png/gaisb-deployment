openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Screen4Hire - AI-powered recruitment platform for multi-corporation use
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Employer authentication and profile
  - name: jobs
    description: Job posting management
  - name: applications
    description: Candidate application management
  - name: screening
    description: AI-powered resume screening and candidate selection
  - name: questionnaire
    description: Email questionnaire management and candidate responses
  - name: interviews
    description: AI video interview configuration and sessions
  - name: dashboard
    description: Employer dashboard and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth / Profile ───────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMyProfile
      tags: [auth]
      summary: Get current employer profile
      responses:
        "200":
          description: Employer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"
        "404":
          description: Profile not found
    post:
      operationId: createMyProfile
      tags: [auth]
      summary: Create employer profile on first login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"

  /auth/profile:
    patch:
      operationId: updateMyProfile
      tags: [auth]
      summary: Update employer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"

  # ─── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Employer dashboard with pipeline overview
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  # ─── Jobs ──────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs for the current employer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /jobs/{id}/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get pipeline statistics for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  # ─── Applications ──────────────────────────────────────────────────────────
  /jobs/{jobId}/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all applications for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a new application (resume as text or base64 PDF)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get a single application with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AI Screening ──────────────────────────────────────────────────────────
  /jobs/{jobId}/screen:
    post:
      operationId: screenApplications
      tags: [screening]
      summary: Run AI screening on all applications for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Screening results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningResult"

  /jobs/{jobId}/send-questionnaires:
    post:
      operationId: sendQuestionnaires
      tags: [screening]
      summary: Send email questionnaires to top candidates selected by employer criteria
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendQuestionnaireInput"
      responses:
        "200":
          description: Questionnaires sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendQuestionnaireResult"

  /jobs/{jobId}/select-finalists:
    post:
      operationId: selectFinalists
      tags: [screening]
      summary: AI selects 3-5 finalists based on questionnaire responses
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Selected finalists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"

  # ─── Questionnaire (public candidate-facing) ───────────────────────────────
  /questionnaire/{token}:
    get:
      operationId: getQuestionnaire
      tags: [questionnaire]
      summary: Get questionnaire for a candidate (public, via token)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Questionnaire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnairePublic"

  /questionnaire/{token}/submit:
    post:
      operationId: submitQuestionnaire
      tags: [questionnaire]
      summary: Candidate submits questionnaire responses
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireResponseInput"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireSubmitResult"

  /applications/{id}/questionnaire:
    get:
      operationId: getApplicationQuestionnaire
      tags: [questionnaire]
      summary: Get questionnaire and response for an application (employer view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Questionnaire with response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireDetail"

  # ─── Interview Questions (employer config) ─────────────────────────────────
  /jobs/{jobId}/interview-questions:
    get:
      operationId: listInterviewQuestions
      tags: [interviews]
      summary: List configured interview questions for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewQuestion"
    post:
      operationId: createInterviewQuestion
      tags: [interviews]
      summary: Add an interview question
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestion"

  /interview-questions/{id}:
    patch:
      operationId: updateInterviewQuestion
      tags: [interviews]
      summary: Update an interview question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestion"
    delete:
      operationId: deleteInterviewQuestion
      tags: [interviews]
      summary: Delete an interview question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Interview Sessions ────────────────────────────────────────────────────
  /applications/{id}/interview:
    get:
      operationId: getInterviewSession
      tags: [interviews]
      summary: Get interview session for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
    post:
      operationId: createInterviewSession
      tags: [interviews]
      summary: Create (schedule) an interview session for a finalist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interview-sessions/{id}/start:
    post:
      operationId: startInterviewSession
      tags: [interviews]
      summary: Start HeyGen streaming session and get access token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HeyGen session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSessionToken"

  /interview-sessions/{id}/transcript:
    patch:
      operationId: saveInterviewTranscript
      tags: [interviews]
      summary: Save transcript and notes after interview completes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Employer ──────────────────────────────────────────────────────────────
    Employer:
      type: object
      properties:
        id:          { type: integer }
        clerkUserId: { type: string }
        companyName: { type: string }
        email:       { type: string }
        industry:    { type: ["string", "null"] }
        logoUrl:     { type: ["string", "null"] }
        createdAt:   { type: string }
      required: [id, clerkUserId, companyName, email, createdAt]

    EmployerInput:
      type: object
      properties:
        companyName: { type: string, minLength: 1 }
        email:       { type: string }
        industry:    { type: string }
      required: [companyName, email]

    EmployerUpdate:
      type: object
      properties:
        companyName: { type: string, minLength: 1 }
        industry:    { type: string }
        logoUrl:     { type: string }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    Dashboard:
      type: object
      properties:
        totalJobs:               { type: integer }
        activeJobs:              { type: integer }
        totalApplications:       { type: integer }
        pendingScreening:        { type: integer }
        questionnairesSent:      { type: integer }
        finalistsSelected:       { type: integer }
        interviewsCompleted:     { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        jobsSummary:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
      required: [totalJobs, activeJobs, totalApplications, pendingScreening, questionnairesSent, finalistsSelected, interviewsCompleted, recentActivity, jobsSummary]

    ActivityItem:
      type: object
      properties:
        type:        { type: string }
        description: { type: string }
        timestamp:   { type: string }
        jobTitle:    { type: ["string", "null"] }
      required: [type, description, timestamp]

    JobSummary:
      type: object
      properties:
        id:           { type: integer }
        title:        { type: string }
        status:       { type: string }
        applications: { type: integer }
        finalists:    { type: integer }
        interviewed:  { type: integer }
      required: [id, title, status, applications, finalists, interviewed]

    # ── Jobs ──────────────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id:                     { type: integer }
        employerId:             { type: integer }
        title:                  { type: string }
        description:            { type: string }
        department:             { type: ["string", "null"] }
        location:               { type: ["string", "null"] }
        salaryRange:            { type: ["string", "null"] }
        screeningCriteria:      { type: string }
        maxCandidatesToEmail:   { type: integer }
        status:                 { type: string, enum: [draft, active, closed] }
        applicationCount:       { type: integer }
        createdAt:              { type: string }
        updatedAt:              { type: string }
      required: [id, employerId, title, description, screeningCriteria, maxCandidatesToEmail, status, applicationCount, createdAt, updatedAt]

    JobInput:
      type: object
      properties:
        title:                  { type: string, minLength: 1 }
        description:            { type: string, minLength: 1 }
        department:             { type: string }
        location:               { type: string }
        salaryRange:            { type: string }
        screeningCriteria:      { type: string, minLength: 1, description: "Criteria used by AI to evaluate and rank candidates" }
        maxCandidatesToEmail:   { type: integer, minimum: 1, maximum: 100 }
        status:                 { type: string, enum: [draft, active] }
      required: [title, description, screeningCriteria, maxCandidatesToEmail]

    JobUpdate:
      type: object
      properties:
        title:                  { type: string }
        description:            { type: string }
        department:             { type: string }
        location:               { type: string }
        salaryRange:            { type: string }
        screeningCriteria:      { type: string }
        maxCandidatesToEmail:   { type: integer }
        status:                 { type: string, enum: [draft, active, closed] }

    JobStats:
      type: object
      properties:
        jobId:               { type: integer }
        totalApplications:   { type: integer }
        screened:            { type: integer }
        questionnairesSent:  { type: integer }
        responsesReceived:   { type: integer }
        finalistsSelected:   { type: integer }
        interviewsScheduled: { type: integer }
        interviewsCompleted: { type: integer }
        averageAiScore:      { type: ["number", "null"] }
      required: [jobId, totalApplications, screened, questionnairesSent, responsesReceived, finalistsSelected, interviewsScheduled, interviewsCompleted]

    # ── Applications ──────────────────────────────────────────────────────────
    Application:
      type: object
      properties:
        id:              { type: integer }
        jobId:           { type: integer }
        candidateName:   { type: string }
        email:           { type: string }
        phone:           { type: ["string", "null"] }
        resumeFileName:  { type: ["string", "null"] }
        aiScore:         { type: ["integer", "null"] }
        aiSummary:       { type: ["string", "null"] }
        status:          { type: string, enum: [new, screening, questionnaire_sent, questionnaire_responded, finalist, interview_scheduled, interview_completed, hired, rejected] }
        employerNotes:   { type: ["string", "null"] }
        createdAt:       { type: string }
      required: [id, jobId, candidateName, email, status, createdAt]

    ApplicationDetail:
      type: object
      properties:
        id:              { type: integer }
        jobId:           { type: integer }
        candidateName:   { type: string }
        email:           { type: string }
        phone:           { type: ["string", "null"] }
        resumeText:      { type: ["string", "null"] }
        resumeFileName:  { type: ["string", "null"] }
        aiScore:         { type: ["integer", "null"] }
        aiSummary:       { type: ["string", "null"] }
        aiStrengths:     { type: ["string", "null"] }
        aiWeaknesses:    { type: ["string", "null"] }
        status:          { type: string }
        employerNotes:   { type: ["string", "null"] }
        createdAt:       { type: string }
        job:
          $ref: "#/components/schemas/Job"
      required: [id, jobId, candidateName, email, status, createdAt, job]

    ApplicationInput:
      type: object
      properties:
        candidateName:   { type: string, minLength: 1 }
        email:           { type: string }
        phone:           { type: string }
        resumeText:      { type: string, description: "Plain text resume content" }
        resumeBase64:    { type: string, description: "Base64-encoded PDF resume" }
        resumeFileName:  { type: string }
      required: [candidateName, email]

    ApplicationUpdate:
      type: object
      properties:
        status:        { type: string, enum: [new, screening, questionnaire_sent, questionnaire_responded, finalist, interview_scheduled, interview_completed, hired, rejected] }
        employerNotes: { type: string }

    # ── Screening ─────────────────────────────────────────────────────────────
    ScreeningResult:
      type: object
      properties:
        screened:    { type: integer }
        message:     { type: string }
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
      required: [screened, message, applications]

    SendQuestionnaireInput:
      type: object
      properties:
        count:     { type: integer, minimum: 1, description: "How many top-ranked candidates to send the questionnaire to" }
        questions:
          type: array
          items:
            type: string
          minItems: 1
          description: "Questions to ask in the email questionnaire"
        deadline:  { type: string, description: "ISO date string for response deadline" }
      required: [count, questions]

    SendQuestionnaireResult:
      type: object
      properties:
        sent:    { type: integer }
        message: { type: string }
      required: [sent, message]

    # ── Questionnaire ─────────────────────────────────────────────────────────
    QuestionnairePublic:
      type: object
      properties:
        token:        { type: string }
        candidateName: { type: string }
        companyName:  { type: string }
        jobTitle:     { type: string }
        questions:
          type: array
          items:
            type: string
        deadline:     { type: ["string", "null"] }
        alreadySubmitted: { type: boolean }
      required: [token, candidateName, companyName, jobTitle, questions, alreadySubmitted]

    QuestionnaireResponseInput:
      type: object
      properties:
        answers:
          type: array
          items:
            type: string
          minItems: 1
      required: [answers]

    QuestionnaireSubmitResult:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
      required: [success, message]

    QuestionnaireDetail:
      type: object
      properties:
        id:           { type: integer }
        applicationId: { type: integer }
        token:        { type: string }
        questions:
          type: array
          items:
            type: string
        sentAt:       { type: ["string", "null"] }
        deadline:     { type: ["string", "null"] }
        status:       { type: string, enum: [pending, sent, responded, expired] }
        response:
          type: ["object", "null"]
          properties:
            answers:
              type: array
              items:
                type: string
            aiScore:    { type: ["integer", "null"] }
            aiAnalysis: { type: ["string", "null"] }
            submittedAt: { type: ["string", "null"] }
      required: [id, applicationId, token, questions, status]

    # ── Interview Questions ────────────────────────────────────────────────────
    InterviewQuestion:
      type: object
      properties:
        id:              { type: integer }
        jobId:           { type: integer }
        questionText:    { type: string }
        orderIndex:      { type: integer }
        responseScript:  { type: ["string", "null"], description: "Pre-written employer response the AI avatar delivers after the candidate answers" }
        createdAt:       { type: string }
      required: [id, jobId, questionText, orderIndex, createdAt]

    InterviewQuestionInput:
      type: object
      properties:
        questionText:   { type: string, minLength: 1 }
        orderIndex:     { type: integer }
        responseScript: { type: string }
      required: [questionText, orderIndex]

    InterviewQuestionUpdate:
      type: object
      properties:
        questionText:   { type: string }
        orderIndex:     { type: integer }
        responseScript: { type: string }

    # ── Interview Sessions ─────────────────────────────────────────────────────
    InterviewSession:
      type: object
      properties:
        id:              { type: integer }
        applicationId:   { type: integer }
        heygenSessionId: { type: ["string", "null"] }
        status:          { type: string, enum: [pending, active, completed, failed] }
        transcript:
          type: ["array", "null"]
          items:
            type: object
            properties:
              role:    { type: string }
              content: { type: string }
              time:    { type: string }
        notes:           { type: ["string", "null"] }
        completedAt:     { type: ["string", "null"] }
        createdAt:       { type: string }
      required: [id, applicationId, status, createdAt]

    InterviewSessionToken:
      type: object
      properties:
        sessionId:  { type: string }
        token:      { type: string }
        realtimeEndpoint: { type: string }
      required: [sessionId, token, realtimeEndpoint]

    TranscriptInput:
      type: object
      properties:
        transcript:
          type: array
          items:
            type: object
            properties:
              role:    { type: string }
              content: { type: string }
              time:    { type: string }
        notes: { type: string }
        status: { type: string, enum: [completed, failed] }
